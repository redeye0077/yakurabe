services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
      - "5555:5555" # Prisma Studio用
    volumes:
      - .:/app
      - /app/node_modules # ホスト側のnode_modulesで上書きしないようにする
      - /app/.next # ビルドキャッシュも同様
    env_file:
      - .env
    environment:
      # コンテナ内からはサービス名 "db" で名前解決できる
      DATABASE_URL: "mysql://root:root@db:3306/yakurabe"
      DATABASE_HOST: "db"
      DATABASE_USER: "root"
      DATABASE_PASSWORD: "root"
      DATABASE_NAME: "yakurabe"
      # メール内の認証リンク等のベースURL
      APP_URL: "http://localhost:3000"
      # 開発環境ではMailpitにSMTPで送信する(実際には外部に配送されない)
      MAIL_DRIVER: "smtp"
      MAIL_FROM: "no-reply@yakurabe.local"
      SMTP_HOST: "mailpit"
      SMTP_PORT: "1025"
      # 開発環境では画像を S3Mock に保存する(認証情報は検証されないのでダミー)
      S3_REGION: "ap-northeast-1"
      S3_BUCKET: "yakurabe-dev"
      S3_ACCESS_KEY_ID: "dummy"
      S3_SECRET_ACCESS_KEY: "dummy"
      S3_PUBLIC_BASE_URL: "http://localhost:9090/yakurabe-dev"
      # サーバー(このコンテナ)からはサービス名 "s3mock"、ブラウザからは localhost で届く
      S3_ENDPOINT: "http://s3mock:9090"
      S3_PUBLIC_ENDPOINT: "http://localhost:9090"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      s3mock:
        condition: service_started
    command: npm run dev

  # 開発用のメール受信サーバー。送信されたメールは http://localhost:8025 で確認できる
  # 本番(docker-compose.prod.yml)には含めない
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

  # 開発用の S3 互換サーバー。画像は http://localhost:9090/yakurabe-dev/<key> で表示できる
  # 署名・アップロード条件(サイズ・形式)・CORS の許可元は検証しない(本番 S3 では検証される)
  # 本番(docker-compose.prod.yml)には含めない
  s3mock:
    image: adobe/s3mock:5.2.3
    restart: unless-stopped
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: "yakurabe-dev"
      # 既定では停止時にデータを消すため、名前付きボリュームに残す
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: "/s3mockroot"
    ports:
      - "127.0.0.1:9090:9090" # ブラウザから署名付き URL でアップロード・画像を表示する用
    volumes:
      - s3mock_data:/s3mockroot

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: yakurabe
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306" # ホストからPrisma Studio等で直接繋ぎたい場合用
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  s3mock_data:
