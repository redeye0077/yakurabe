services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
      - "5555:5555" # Prisma Studio用
    volumes:
      - .:/app
      - /app/node_modules # ホスト側のnode_modulesで上書きしないようにする
      - /app/.next # ビルドキャッシュも同様
    env_file:
      - .env
    environment:
      # コンテナ内からはサービス名 "db" で名前解決できる
      DATABASE_URL: "mysql://root:root@db:3306/yakurabe"
      DATABASE_HOST: "db"
      DATABASE_USER: "root"
      DATABASE_PASSWORD: "root"
      DATABASE_NAME: "yakurabe"
      # 開発環境ではMailpitにSMTPで送信する(実際には外部に配送されない)
      MAIL_DRIVER: "smtp"
      MAIL_FROM: "no-reply@yakurabe.local"
      SMTP_HOST: "mailpit"
      SMTP_PORT: "1025"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    command: npm run dev

  # 開発用のメール受信サーバー。送信されたメールは http://localhost:8025 で確認できる
  # 本番(docker-compose.prod.yml)には含めない
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: yakurabe
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306" # ホストからPrisma Studio等で直接繋ぎたい場合用
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
